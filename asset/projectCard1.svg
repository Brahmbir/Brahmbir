
<!-- Save as digital_landscape_card.svg or embed directly using <img src="..."> in Markdown -->
<svg width="360" height="560" viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg" style="border-radius:16px">
  <!-- Background -->
  <rect width="360" height="560" rx="20" fill="#DDE8DC"/>
  
  
  <!-- Image Placeholder -->
  <clipPath id="clipImage">
    <rect x="20" y="20" width="320" height="200" rx="12" />
  </clipPath>
  <image href="https://www.techsmith.com/wp-content/uploads/2023/08/What-are-High-Resolution-Images.png" x="20" y="20" width="320" height="200" clip-path="url(#clipImage)"  preserveAspectRatio="xMidYMid slice" />

  <!-- Card Body -->
  <rect x="20" y="230" width="320" height="310" rx="12" fill="#F7F2EC" />

  <!-- Course Title -->
  <text x="40" y="265" font-family="sans-serif" font-size="20" fill="#222" font-weight="600">Digital Landscapes</text>

  <!-- Instructor -->
  <text x="40" y="290" font-family="sans-serif" font-size="14" fill="#555">Course by <tspan font-weight="bold">Pierre Deschamps</tspan></text>

  <!-- Info Icons and Text -->
  <text x="40" y="325" font-family="sans-serif" font-size="14" fill="#333">📚 11 Lessons</text>
  <text x="160" y="325" font-family="sans-serif" font-size="14" fill="#333">📈 Intermediate</text>
  <text x="40" y="350" font-family="sans-serif" font-size="14" fill="#333">⏱️ 23 Hours</text>

  <!-- Button -->
  <rect x="100" y="390" rx="20" ry="20" width="160" height="40" fill="#333" />
  <text x="180" y="416" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">Course Details</text>

</svg>
